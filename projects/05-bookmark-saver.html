<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Saver</title>
    <link rel="stylesheet" href="./styles/05-bookmark-saver.css" />
  </head>
  <body>
    <div class="container">
      <h1>Bookmark Saver</h1>
      <form id="bookmark-form" action="">
        <input id="bookmark-name" type="text" placeholder="Bookmark Name" />
        <input id="bookmark-url" type="url" placeholder="Bookmark URL" />
        <button id="submit-btn" type="submit">Add Bookmark</button>
      </form>
      <div id="bookmark-container" class="bookmarks-container"></div>
    </div>

    <script src="./scripts/05-bookmark-saver.js"></script>
  </body>
</html>
