<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Kanban Board</title>
    <link rel="stylesheet" href="./styles/03-kanban-board.css" />
  </head>
  <body>
    <div class="container">
      <h1>Simple Kanban Board</h1>
      <div class="board">
        <!-- Todo-->
        <div class="list" id="list-1">
          <h2>To Do</h2>
          <div class="card" draggable="true" id="card-1">Wash Dishes</div>
          <div class="card" draggable="true" id="card-2">Buy Clothes</div>
        </div>
        <!-- In progress-->
        <div class="list" id="list-2">
          <h2>In Progress</h2>
          <div class="card" draggable="true" id="card-3">Learn to Code</div>
        </div>

        <!--Done-->
        <div class="list" id="list-3">
          <h2>Done</h2>
        </div>
      </div>
    </div>
    <script src="./scripts/03-kanban-board.js"></script>
  </body>
</html>
